name: macOS ARM64 validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/macos.yml
      - local_annotation/**
      - scripts/ci_*
      - tests/**
      - app.py
      - run.py
      - case_bundle.py
      - requirements*.txt

permissions:
  contents: read

concurrency:
  group: macos-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: macOS 15 ARM64 / Python 3.13
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Prepare FFmpeg and test environment
        run: |
          mkdir -p test-artifacts/ci
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-ci.txt
          .venv/bin/python -m playwright install chromium

      - name: Verify architecture and run API / extraction tests
        run: .venv/bin/python scripts/ci_validate.py --require-macos-arm64

      - name: Run browser annotation / export workflow
        run: .venv/bin/python tests/browser_smoke.py

      - name: Inventory visible Apple compute devices (no inference)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          swift scripts/ci_devices.swift > test-artifacts/ci/compute-devices.json 2> test-artifacts/ci/compute-devices.log

      - name: Write result summary
        if: ${{ !cancelled() }}
        run: python scripts/ci_summary.py

      - name: Upload synthetic test reports and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-arm64-validation
          retention-days: 7
          if-no-files-found: warn
          path: |
            test-artifacts/ci/
            test-artifacts/browser/report.json
            test-artifacts/browser/layout-overflow.json
            test-artifacts/browser/server.log
            test-artifacts/browser/*.png
            test-artifacts/browser/trace.zip
            test-artifacts/browser/browser-export.zip
