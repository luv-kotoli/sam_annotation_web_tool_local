<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>视频库 · 本地视频阶段标注</title>
  <link rel="stylesheet" href="/static/workflow.css">
  <link rel="stylesheet" href="/static/local.css">
  <script src="/static/library.js" defer></script>
</head>
<body class="library-page">
  <header class="local-header"><a class="local-brand" href="/">V<span>视频阶段标注<small>本地工作区</small></span></a><span class="local-pill"><i></i>本机视频库</span><a class="quiet-link" href="/clinical/export.zip">导出全部标注 ↗</a></header>
  <main class="library-main">
    <section class="library-heading"><div><div class="eyebrow">VIDEO WORKSPACE</div><h1>让每一段观察都有记录。</h1><p>导入视频，划分阶段，保存你的判断。</p></div><button id="uploadButton" class="primary" type="button">＋ 导入视频</button><input id="uploadInput" type="file" accept="video/*,.mkv,.avi" multiple hidden></section>
    <div id="notice" class="notice" role="status" hidden></div>
    <section id="uploadPanel" class="upload-panel" hidden aria-label="视频导入进度"><div><strong id="uploadName"></strong><span id="uploadStatus"></span></div><progress id="uploadProgress" max="100" value="0"></progress></section>
    <p id="storageLocation" class="subtle"></p>
    <section class="library-tools"><div><h2>视频库 <span id="videoCount">0</span></h2><span class="subtle">视频和标注保存在服务端</span></div><label class="search-box"><span>⌕</span><input id="search" type="search" placeholder="搜索视频名或病例编号" aria-label="搜索视频"></label></section>
    <div class="export-tools"><label><input id="selectPage" type="checkbox"> 选择本页</label><label>抽帧率 <select id="frameFps"><option value="1">1 fps</option><option value="2">2 fps</option><option value="4" selected>4 fps</option><option value="8">8 fps</option></select></label><button id="exportCases" type="button" disabled>导出所选病例包（0）</button><span class="subtle">复核 → 抽帧 → 选择病例导出；原平台帧标注页可直接导入 ZIP。</span></div>
    <section id="videoList" class="video-list" aria-label="视频列表" aria-live="polite"></section>
    <div id="emptyState" class="empty-library" hidden><div class="empty-video">▷</div><h2>从第一段视频开始</h2><p>导入后可播放视频、调整阶段和记录征象。<br>推荐使用浏览器可播放的 MP4（H.264）视频。</p><button id="emptyUpload" type="button">导入视频</button></div>
    <div class="pagination"><button id="previousPage" type="button">上一页</button><span id="pageLabel"></span><button id="nextPage" type="button">下一页</button></div>
    <section class="analysis-panel"><div><h2>阶段 AI</h2><span id="analysisState" class="subtle">正在检查…</span></div><p id="analysisHint" class="subtle"></p><div id="jobs" class="job-list"></div></section>
    <footer>人工标注可独立使用。AI 结果需经人工核对后保存。</footer>
  </main>
  <dialog id="confirmDialog"><form method="dialog"><h2 id="confirmTitle"></h2><p id="confirmMessage"></p><div class="dialog-footer"><button value="cancel">取消</button><button id="confirmOk" value="confirm" class="primary">确认</button></div></form></dialog>
</body>
</html>
